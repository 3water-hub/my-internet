<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务报表分析 · 输入企业名称即可分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📊 财报分析助手</div>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="输入企业名称或代码（如 贵州茅台 / 600519 / 腾讯控股 / 00700）" autocomplete="off">
      <div id="suggest-box" class="suggest-box" hidden></div>
    </div>
  </header>

  <div id="loading" class="loading" style="display:none">加载中…</div>

  <main>
    <section id="empty-state" class="empty-state">
      <div class="hero">
        <h1>输入企业名称，自动分析财务报表</h1>
        <p>搜索 A 股 / 港股上市公司 → 展示近 5 年财务报表 → 解读净利润涨跌原因 → 关联同期公告事件</p>
        <div class="hero-tips">
          <div>📈 营收 / 净利润趋势 &amp; 同比</div>
          <div>🧮 净利润变动归因（营收/毛利率/三费/税金/所得税）</div>
          <div>📰 报告期前后公告事件时间线</div>
        </div>
        <div class="hero-demo">试试：<a href="#" onclick="var i=document.getElementById('search-input');i.value='贵州茅台';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();return false;">贵州茅台</a> · <a href="#" onclick="var i=document.getElementById('search-input');i.value='平安银行';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();return false;">平安银行</a> · <a href="#" onclick="var i=document.getElementById('search-input');i.value='腾讯控股';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();return false;">腾讯控股(港股)</a></div>
      </div>
    </section>

    <div id="content" hidden>
      <div id="company-header" class="company-header"></div>

      <nav class="tabs">
        <div class="tab active" data-tab="overview">概览</div>
        <div class="tab" data-tab="income">利润表</div>
        <div class="tab" data-tab="balance">资产负债表</div>
        <div class="tab" data-tab="cashflow">现金流量表</div>
        <div class="tab" data-tab="analysis">涨跌分析</div>
      </nav>

      <section id="tab-overview" class="tab-panel">
        <div id="ov-kpis" class="kpis"></div>
        <div class="card chart-card"><div class="card-title">营业总收入 &amp; 归母净利润趋势</div><div class="chart" id="ov-chart-1"></div></div>
        <div class="grid-2">
          <div class="card chart-card"><div class="card-title">盈利能力趋势</div><div class="chart" id="ov-chart-2"></div></div>
          <div class="card chart-card"><div class="card-title">费用结构</div><div class="chart" id="ov-chart-3"></div></div>
        </div>
        <div class="card"><div class="card-title">主要指标（近 6 年年报）</div><div id="ov-table"></div></div>
      </section>

      <section id="tab-income" class="tab-panel" hidden>
        <div id="income-panel"></div>
      </section>

      <section id="tab-balance" class="tab-panel" hidden>
        <div id="balance-panel"></div>
      </section>

      <section id="tab-cashflow" class="tab-panel" hidden>
        <div id="cashflow-panel"></div>
      </section>

      <section id="tab-analysis" class="tab-panel" hidden>
        <div id="analysis-panel"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    数据来源：东方财富公开接口 · 仅供学习研究，不构成投资建议。
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/jsonp.js"></script>
  <script src="js/api.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
